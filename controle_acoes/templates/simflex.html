{% extends "base.html" %}
{% block title %}SimFlex{% endblock %}

{% block content %}
<style>
  .sf { --sf-bg:#1f1f1f; --sf-bg2:#262626; --sf-line:#3a3a3a; --sf-orange:#f59e0b; --sf-blue:#3b82f6; --sf-red:#ef4444;
        --sf-green:#34d399; --sf-txt:#e5e5e5; --sf-mut:#a3a3a3;
        background:var(--sf-bg); color:var(--sf-txt); border:1px solid var(--sf-line); border-radius:8px; overflow:hidden; }
  .sf-tabs { display:flex; align-items:stretch; border-bottom:1px solid var(--sf-line); overflow-x:auto; }
  .sf-tab { display:flex; align-items:center; gap:.45rem; padding:.7rem 1rem; font-size:.8rem; font-weight:600; letter-spacing:.04em;
            text-transform:uppercase; color:var(--sf-mut); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; user-select:none; }
  .sf-tab:hover { color:var(--sf-txt); }
  .sf-tab.on { color:var(--sf-blue); border-bottom-color:var(--sf-blue); }
  .sf-tab .x { color:var(--sf-blue); font-size:1rem; line-height:1; padding:0 .15rem; }
  .sf-tab.fix { color:var(--sf-txt); }
  .sf-tab.sep { border-right:1px solid var(--sf-line); }
  .sf-tab .dirty { color:var(--sf-orange); }
  .sf-head { display:flex; flex-wrap:wrap; gap:1.2rem; align-items:flex-end; padding:.8rem 1rem; border-bottom:1px solid var(--sf-line); }
  .sf-grp { display:flex; flex-direction:column; gap:.35rem; }
  .sf-grp > label { font-size:.85rem; font-weight:600; }
  .sf-in { background:#141414; color:var(--sf-txt); border:1px solid var(--sf-line); border-radius:3px; padding:.35rem .5rem; font-size:.82rem; }
  .sf-in.or { color:var(--sf-orange); text-align:right; }
  .sf-btn { border:none; border-radius:3px; padding:.45rem .9rem; font-size:.72rem; font-weight:700; letter-spacing:.05em; color:#fff; cursor:pointer; text-transform:uppercase; }
  .sf-btn.blue { background:var(--sf-blue); } .sf-btn.red { background:var(--sf-red); } .sf-btn.green { background:#2e7d32; }
  .sf-btn.gray { background:#424242; }
  .sf-btn:hover { filter:brightness(1.12); }
  .sf-spot { font-size:1.6rem; font-weight:700; color:var(--sf-orange); }
  .sf-chg { font-size:.75rem; } .sf-time { font-size:.75rem; font-weight:600; }
  .sf-save { position:relative; margin-left:auto; display:flex; }
  .sf-save .sf-btn { border-radius:3px 0 0 3px; padding:.6rem 1rem; }
  .sf-save .dd { border-radius:0 3px 3px 0; border-left:1px solid rgba(255,255,255,.2); padding:.6rem .6rem; }
  .sf-menu { position:absolute; right:0; top:100%; margin-top:4px; background:#2a2a2a; border:1px solid var(--sf-line); border-radius:4px;
             min-width:180px; z-index:50; display:none; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  .sf-menu.on { display:block; }
  .sf-menu div { padding:.6rem .9rem; font-size:.85rem; cursor:pointer; }
  .sf-menu div:hover { background:#383838; }
  .sf-wrap { overflow-x:auto; }
  table.sf-t { border-collapse:collapse; width:100%; font-size:.8rem; min-width:1500px; }
  table.sf-t th { font-weight:500; padding:.55rem .35rem; border-bottom:1px solid var(--sf-line); text-align:center; white-space:nowrap; }
  table.sf-t th.grp { border-left:1px solid var(--sf-line); }
  table.sf-t td { padding:.25rem .3rem; text-align:center; white-space:nowrap; border-bottom:1px solid #2c2c2c; }
  table.sf-t td.bl, table.sf-t th.bl { border-left:1px solid var(--sf-line); }
  table.sf-t tr.off td { opacity:.4; }
  table.sf-t tfoot td { padding:.45rem .35rem; border-top:1px solid var(--sf-line); }
  .sf-t input.n, .sf-t select { background:#141414; color:var(--sf-orange); border:1px solid #333; border-radius:3px; padding:.3rem .35rem; font-size:.8rem; }
  .sf-t input.n { width:74px; text-align:right; }
  .sf-t input.q { width:72px; }
  .sf-t select.exp { width:92px; color:var(--sf-txt); }
  .sf-t select.stk { width:150px; color:var(--sf-txt); }
  .sf-cv { border:none; border-radius:3px; color:#fff; font-size:.7rem; font-weight:700; width:92px; padding:.45rem 0; cursor:pointer; }
  .sf-cv.b { background:var(--sf-blue); } .sf-cv.s { background:var(--sf-red); }
  .sf-lock { background:none; border:none; cursor:pointer; font-size:.95rem; padding:0 .15rem; }
  .sf-lock.on { color:var(--sf-green); } .sf-lock.off { color:var(--sf-mut); }
  .sf-del { background:none; border:none; color:var(--sf-red); cursor:pointer; font-size:1rem; }
  .sf-hdl { cursor:grab; color:var(--sf-mut); padding:0 .2rem; user-select:none; }
  .sf-itm { color:var(--sf-red); font-weight:700; font-size:.75rem; margin-left:.25rem; }
  .sf-or { color:var(--sf-orange); }
  .pos { color:var(--sf-green); } .neg { color:var(--sf-red); }
  .sf-g.hide { display:none; }
  .sf-chartbar { display:flex; gap:1.6rem; align-items:center; padding:.55rem 1rem; border-top:1px solid var(--sf-line); position:relative; flex-wrap:wrap; }
  .sf-dd { position:relative; }
  .sf-dd > span { cursor:pointer; font-size:.85rem; user-select:none; }
  .sf-dd .pane { position:absolute; left:0; top:130%; background:#2a2a2a; border:1px solid var(--sf-line); border-radius:4px; padding:.6rem .8rem;
                 z-index:40; display:none; white-space:nowrap; box-shadow:0 6px 20px rgba(0,0,0,.5); font-size:.82rem; }
  .sf-dd.on .pane { display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; }
  .sf-dd .pane label { display:flex; align-items:center; gap:.3rem; cursor:pointer; }
  .sf-main { display:flex; gap:0; align-items:stretch; }
  .sf-chartbox { flex:1; min-width:0; position:relative; padding:.2rem .5rem .5rem; }
  .sf-stats .r > span:last-child { white-space:nowrap; text-align:right; }
  .sf-stats { width:360px; padding:1rem .9rem; font-size:.92rem; flex-shrink:0; }
  .sf-stats .r { display:flex; justify-content:space-between; align-items:center; padding:.32rem 0; gap:.5rem; }
  .sf-stats .r.sep { border-top:1px solid var(--sf-line); }
  .sf-pill { border-radius:3px; padding:.05rem .35rem; color:#fff; font-size:.85rem; }
  .sf-pill.g { background:#2e7d32; } .sf-pill.r { background:#e53935; }
  .sf-sig { position:absolute; top:.1rem; left:50%; transform:translateX(-50%); display:flex; font-size:.9rem; z-index:5; }
  .sf-sig span { padding:0 .3rem; cursor:pointer; color:#ddd; }
  .sf-sig span.on { background:#d4a017; color:#fff; }
  .sf-shot { position:absolute; top:.3rem; right:1.2rem; cursor:pointer; color:var(--sf-mut); font-size:1.1rem; z-index:5; background:none; border:none; }
  .sf-switch { display:flex; align-items:center; gap:.3rem; font-size:.82rem; margin-left:.6rem; }
  .sf-switch input { accent-color:var(--sf-blue); }
  .sf-list { padding:1rem; }
  .sf-list table { width:100%; border-collapse:collapse; font-size:.85rem; }
  .sf-list th, .sf-list td { padding:.5rem .6rem; border-bottom:1px solid var(--sf-line); text-align:left; }
  .sf-list tr:hover td { background:#262626; }
  .sf-empty { padding:2rem; text-align:center; color:var(--sf-mut); }
  .sf-hint { font-size:.75rem; color:var(--sf-mut); padding:.3rem 1rem .8rem; }
  .sf-hist { border-top:1px solid var(--sf-line); padding:.9rem 1rem 1rem; }
  .sf-hist h4 { margin:0 0 .7rem; font-size:.95rem; display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .sf-hist h4 .tag { font-size:.7rem; font-weight:600; padding:.1rem .45rem; border-radius:3px; background:rgba(96,165,250,.15); color:#60a5fa; }
  .sf-eq { display:flex; align-items:stretch; gap:.5rem; flex-wrap:wrap; margin-bottom:.8rem; }
  .sf-eq .box { background:var(--sf-bg2); border:1px solid var(--sf-line); border-radius:6px; padding:.55rem .8rem; min-width:170px; }
  .sf-eq .box small { display:block; color:var(--sf-mut); font-size:.72rem; margin-bottom:.15rem; }
  .sf-eq .box b { font-size:1.05rem; }
  .sf-eq .op { align-self:center; font-size:1.3rem; color:var(--sf-mut); padding:0 .1rem; }
  .sf-eq .box.tot { border-color:#60a5fa; }
  .sf-tl { position:relative; margin:.3rem 0 0 .6rem; padding-left:1.4rem; border-left:2px solid var(--sf-line); }
  .sf-ev { position:relative; margin-bottom:.75rem; background:var(--sf-bg2); border:1px solid var(--sf-line); border-radius:6px; padding:.55rem .75rem; }
  .sf-ev::before { content:attr(data-n); position:absolute; left:-2.15rem; top:.5rem; width:1.4rem; height:1.4rem; border-radius:50%;
                   background:#3b82f6; color:#fff; font-size:.72rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .sf-ev .hd { display:flex; justify-content:space-between; gap:.6rem; flex-wrap:wrap; font-size:.85rem; }
  .sf-ev .hd .dt { color:var(--sf-mut); font-size:.75rem; }
  .sf-ev .bd { font-size:.8rem; color:#cfcfcf; margin-top:.3rem; line-height:1.55; }
  .sf-ev .pl { font-weight:700; white-space:nowrap; }
  .sf-ev.nc { opacity:.65; }
  .sf-leg { display:inline-block; padding:.02rem .35rem; border-radius:3px; font-size:.72rem; font-weight:700; margin-right:.2rem; }
  .sf-leg.c { background:rgba(59,130,246,.18); color:#60a5fa; } .sf-leg.v { background:rgba(248,113,113,.16); color:#f87171; }
  .sf-hgrid { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:1rem; }
  .sf-obs { white-space:pre-wrap; background:var(--sf-bg2); border:1px dashed var(--sf-line); border-radius:6px; padding:.6rem .8rem; font-size:.82rem; }
  @media (max-width: 900px) { .sf-hgrid { grid-template-columns:1fr; } }
  @media (max-width: 900px) { .sf-main { flex-direction:column; } .sf-stats { width:auto; } }
</style>

<div class="sf" id="sf">
  <div class="sf-tabs" id="sf-tabs"></div>
  <div id="sf-body"></div>
</div>

<datalist id="sf-ativos">
  {% for rv in ranking_vol %}<option value="{{ rv.ticker }}">{% endfor %}
</datalist>

<script>
(function () {
'use strict';
var SELIC = {{ selic|default(13.75) }};
var TABS = [];          // abas abertas
var CUR = 'list';       // 'list' ou índice da aba
var NOVAS = 0;
var GL = {               // preferências do gráfico (globais)
  teorica: false, expiracao: true, atual: true, area: false, pct: false, sig: 2,
  probSrc: 'teo', probManual: 30, slices: [], nMeses: 3, weekly: false, mercado: 'merc', gregas: true
};
try { var _g = JSON.parse(localStorage.getItem('simflex_gl') || 'null'); if (_g) { for (var k in _g) GL[k] = _g[k]; } } catch (e) {}
if (!GL.v2) { GL.probSrc = 'teo'; GL.v2 = 1; }
function salvaGL() { try { localStorage.setItem('simflex_gl', JSON.stringify(GL)); } catch (e) {} }

// ── utilitários ──────────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function fmt(v, d) { if (v == null || isNaN(v)) return '—'; return Number(v).toLocaleString('pt-BR', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }); }
function brl(v) { if (v == null || isNaN(v)) return '—'; return 'R$' + fmt(v, 2); }
function num(s) { if (s == null) return null; s = String(s).trim().replace(/\./g, '').replace(',', '.'); if (s === '' || s === '-') return null; var n = parseFloat(s); return isNaN(n) ? null : n; }
function hoje() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function dIso(iso) { var p = String(iso).slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function isoD(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function brD(iso) { return iso ? String(iso).slice(0, 10).split('-').reverse().join('/') : '—'; }
// Feriados da B3 (nacionais + Carnaval, Sexta-feira Santa, Corpus Christi, 24/12 e 31/12)
var FER = {};
function feriados(y) {
  if (FER[y]) return FER[y];
  var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
      g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
      l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  var pascoa = new Date(y, mes - 1, dia), set = {};
  var rel = function (n) { var x = new Date(pascoa.getTime()); x.setDate(x.getDate() + n); set[isoD(x)] = 1; };
  rel(-48); rel(-47); rel(-2); rel(60);
  ['01-01', '04-21', '05-01', '09-07', '10-12', '11-02', '11-15', '11-20', '12-24', '12-25', '12-31'].forEach(function (s) { set[y + '-' + s] = 1; });
  FER[y] = set; return set;
}
function util(d) { var w = d.getDay(); return w !== 0 && w !== 6 && !feriados(d.getFullYear())[isoD(d)]; }
// dias úteis de a (exclusive) até b (inclusive)
function du(a, b) {
  if (!(b > a)) return 0;
  var n = 0, d = new Date(a.getTime());
  while (d < b) { d.setDate(d.getDate() + 1); if (util(d)) n++; }
  return n;
}
function addDu(a, n) { var d = new Date(a.getTime()); while (n > 0) { d.setDate(d.getDate() + 1); if (util(d)) n--; } return d; }

// ── Black-Scholes ────────────────────────────────────────────────────────
function ncdf(x) { var t = 1 / (1 + 0.2316419 * Math.abs(x)); var d = 0.3989423 * Math.exp(-x * x / 2);
  var p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; }
function npdf(x) { return Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI); }
// mesma convenção da OpLab: r = juros/100 como taxa contínua, T = dias úteis/252
function rr() { return (TAB() ? TAB().juros : SELIC) / 100; }
function bs(S, K, T, r, v, call) {
  if (T <= 0 || v <= 0) return Math.max(0, call ? S - K : K - S);
  var sq = v * Math.sqrt(T), d1 = (Math.log(S / K) + (r + v * v / 2) * T) / sq, d2 = d1 - sq;
  return call ? S * ncdf(d1) - K * Math.exp(-r * T) * ncdf(d2) : K * Math.exp(-r * T) * ncdf(-d2) - S * ncdf(-d1);
}
function greeks(S, K, T, r, v, call) {
  if (T <= 0 || v <= 0) { var itm = call ? S > K : S < K; return { d: itm ? (call ? 1 : -1) : 0, g: 0, t: 0, v: 0, r: 0 }; }
  var sq = v * Math.sqrt(T), d1 = (Math.log(S / K) + (r + v * v / 2) * T) / sq, d2 = d1 - sq, df = Math.exp(-r * T);
  var th = -S * npdf(d1) * v / (2 * Math.sqrt(T)) + (call ? -r * K * df * ncdf(d2) : r * K * df * ncdf(-d2));
  return { d: call ? ncdf(d1) : ncdf(d1) - 1, g: npdf(d1) / (S * sq), t: th / 252, v: S * npdf(d1) * Math.sqrt(T) / 100,
           r: (call ? K * T * df * ncdf(d2) : -K * T * df * ncdf(-d2)) / 100 };
}
function iv(S, K, T, r, px, call) {
  if (!(px > 0) || T <= 0) return null;
  var lo = 0.005, hi = 5;
  if (px <= bs(S, K, T, r, lo, call) || px >= bs(S, K, T, r, hi, call)) return null;
  for (var i = 0; i < 80; i++) { var m = (lo + hi) / 2; if (bs(S, K, T, r, m, call) > px) hi = m; else lo = m; }
  return (lo + hi) / 2;
}

// ── estado ───────────────────────────────────────────────────────────────
function TAB() { return typeof CUR === 'number' ? TABS[CUR] : null; }
function novaAba(o) {
  o = o || {};
  var t = { id: o.id || null, name: o.name || ('Nova ' + (++NOVAS)), ativo: (o.ativo || '').toUpperCase(), spot: null, chg: null, hora: '',
            chain: null, ewma: null, ivAtivo: null, juros: SELIC, legs: [], dirty: !o.id, notes: o.notes || '',
            hist: o.hist || null, carry: 0, useCarry: true };
  TABS.push(t);
  return t;
}
function T(leg, from) { return leg.exp ? du(from || hoje(), dIso(leg.exp)) / 252 : 0; }
function isCall(l) { return l.type === 'CALL'; }
function sgn(l) { return l.side === 'BUY' ? 1 : -1; }
function teoVolDe(t, l) { return l.teoVol != null ? l.teoVol : (t.ivAtivo || t.ewma || (l.q && l.q.iv) || null); }

function cotacaoDe(t, l) {
  // procura a opção na cadeia pelo ticker; senão por vencimento + strike
  if (!t.chain) return null;
  var exps = t.chain.expirations || [];
  for (var i = 0; i < exps.length; i++) {
    var rows = exps[i].rows || [];
    for (var j = 0; j < rows.length; j++) {
      var o = l.type === 'PUT' ? rows[j].put : rows[j].call;
      if (o && l.ticker && o.symbol === l.ticker) return o;
    }
  }
  var bl = exps.filter(function (e) { return e.exp === l.exp; })[0];
  var row = bl && (bl.rows || []).filter(function (r) { return Math.abs(r.strike - l.strike) < 0.001; })[0];
  return row ? (l.type === 'PUT' ? row.put : row.call) : null;
}
function precoMercado(l, q, saida) {
  // saída de uma compra = vender (bid); saída de uma venda = recomprar (ask). Entrada é o contrário.
  if (!q) return null;
  var vende = saida ? l.side === 'BUY' : l.side === 'SELL';
  var m = GL.mercado;
  if (m === 'ultimo') return q.close || null;
  if (m === 'medio') return (q.bid && q.ask) ? (q.bid + q.ask) / 2 : (q.close || null);
  if (m === 'teorico') return q.teorico || null;
  // book atual (como a OpLab): venda no bid, compra no ask; sem oferta, último negócio
  return (vende ? (q.bid || q.bid_eff) : (q.ask || q.ask_eff)) || q.close || null;
}
function recalcVols(t, l) {
  if (l.type === 'STOCK' || !t.spot) return;
  var Tt = T(l), r = rr();
  if (l.entPx != null && (l.entLock || l.entVol == null)) { var a = iv(t.spot, l.strike, Tt, r, l.entPx, isCall(l)); if (a) l.entVol = a * 100; }
  if (l.saiPx != null && (l.saiLock || l.saiVol == null)) { var b = iv(t.spot, l.strike, Tt, r, l.saiPx, isCall(l)); if (b) l.saiVol = b * 100; }
}
// Atualiza cotações de uma perna a partir da cadeia (respeitando os cadeados).
function aplicaCotacao(t, l, inicial) {
  if (l.type === 'STOCK') {
    if (t.spot) { if (l.entPx == null || (!l.entLock && inicial)) l.entPx = t.spot; if (!l.saiLock || l.saiPx == null) l.saiPx = t.spot; }
    return;
  }
  var q = cotacaoDe(t, l);
  l.q = q;
  if (q) { l.ticker = q.symbol; }
  var pe = precoMercado(l, q, false), ps = precoMercado(l, q, true);
  if (pe != null && (l.entPx == null || (!l.entLock && inicial))) l.entPx = pe;
  if (ps != null && (!l.saiLock || l.saiPx == null)) l.saiPx = ps;
  recalcVols(t, l);
}

// ── carregamento de cadeia ───────────────────────────────────────────────
function carregaCadeia(t, cb) {
  if (!t.ativo) { render(); return; }
  var st = $('sf-st'); if (st) st.textContent = '⏳ buscando ' + t.ativo + '…';
  fetch('/api/cadeia/' + encodeURIComponent(t.ativo) + '?n=40&n_meses=' + GL.nMeses + '&weekly=' + (GL.weekly ? 1 : 0))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok || res.j.error) { if ($('sf-st')) $('sf-st').textContent = '⚠️ ' + (res.j.error || 'erro na cadeia'); return; }
      var c = res.j;
      t.chain = c; t.spot = c.spot; t.chg = c.spot_change; t.ewma = c.ewma || null; t.ivAtivo = c.iv_ativo || null;
      t.hora = new Date().toLocaleTimeString('pt-BR');
      t.legs.forEach(function (l) { aplicaCotacao(t, l, false); });
      if (cb) cb();
      render();
    })
    .catch(function (e) { if ($('sf-st')) $('sf-st').textContent = '⚠️ falha de rede: ' + e; });
}

// ── abas ─────────────────────────────────────────────────────────────────
function renderTabs() {
  var h = '<div class="sf-tab fix' + (CUR === 'list' ? ' on' : '') + '" data-t="list">📈 Estratégias</div>' +
          '<div class="sf-tab fix sep" data-t="new">＋ Criar</div>';
  TABS.forEach(function (t, i) {
    h += '<div class="sf-tab' + (CUR === i ? ' on' : '') + '" data-t="' + i + '">' + esc(t.name) +
         (t.dirty ? '<span class="dirty" title="alterações não salvas">●</span>' : '') +
         '<span class="x" data-x="' + i + '" title="Fechar">✕</span></div>';
  });
  $('sf-tabs').innerHTML = h;

$('sf-tabs').addEventListener('click', function (e) {

function abrir(id, silencioso) {
  for (var i = 0; i < TABS.length; i++) if (TABS[i].id === id) { CUR = i; render(); return; }

function opcoesVenc(t, l) {
  var exps = (t.chain && t.chain.expirations || []).map(function (e) { return e.exp; });
  if (l.exp && exps.indexOf(l.exp) < 0) exps.push(l.exp);
  exps.sort();
  return '<option value="">—</option>' + exps.map(function (e) {
    var p = e.split('-'); return '<option value="' + e + '"' + (e === l.exp ? ' selected' : '') + '>' + p[2] + '-' + p[1] + '-' + p[0].slice(2) + '</option>';
  }).join('');
}
function opcoesStrike(t, l) {
  var bl = (t.chain && t.chain.expirations || []).filter(function (e) { return e.exp === l.exp; })[0];
  var h = '<option value="">—</option>', achou = false;
  ((bl && bl.rows) || []).forEach(function (r) {
    var o = l.type === 'PUT' ? r.put : r.call; if (!o) return;
    var sel = Math.abs(r.strike - l.strike) < 0.001; if (sel) achou = true;
    h += '<option value="' + r.strike + '"' + (sel ? ' selected' : '') + '>' + fmt(r.strike) + ' - ' + o.symbol + '</option>';
  });
  if (!achou && l.strike) h += '<option value="' + l.strike + '" selected>' + fmt(l.strike) + ' - ' + esc(l.ticker || '') + '</option>';
  return h;
}

function marcaSujo() { var t = TAB(); if (!t.dirty) { t.dirty = true; renderTabs(); } }

function bindAba() {
  var t = TAB();
  var carregar = function () { t.ativo = $('sf-ativo').value.trim().toUpperCase(); carregaCadeia(t); };
  $('sf-ativo').addEventListener('change', function () {
    var novo = this.value.trim().toUpperCase();
    if (novo !== t.ativo && t.legs.some(function (l) { return l.type !== 'STOCK'; }) && !confirm('Trocar o ativo remove as pernas de opção. Continuar?')) { this.value = t.ativo; return; }
    if (novo !== t.ativo) { t.legs = t.legs.filter(function (l) { return l.type === 'STOCK'; }); marcaSujo(); }
    carregar();
  });
  $('sf-ativo').addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });
  $('sf-atu').addEventListener('click', carregar);
  $('sf-juros').addEventListener('change', function () { var v = num(this.value); if (v != null) { t.juros = v; t.legs.forEach(function (l) { recalcVols(t, l); }); renderLegs(); calcula(); } });
  $('sf-nmeses').addEventListener('change', function () { GL.nMeses = +this.value; salvaGL(); carregaCadeia(t); });
  $('sf-weekly').addEventListener('change', function () { GL.weekly = this.checked; salvaGL(); carregaCadeia(t); });
  document.querySelectorAll('[data-add]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (!t.ativo) { alert('Informe o ativo primeiro.'); return; }
      var tp = b.dataset.add;
      var exp0 = (t.chain && t.chain.expirations && t.chain.expirations[0]) ? t.chain.expirations[0].exp : '';
      var ult = t.legs.filter(function (l) { return l.type !== 'STOCK'; }).slice(-1)[0];
      var l = { on: true, type: tp, side: 'BUY', qty: ult ? ult.qty : (tp === 'STOCK' ? 100 : 1000), exp: tp === 'STOCK' ? '' : (ult ? ult.exp : exp0),
                strike: 0, ticker: tp === 'STOCK' ? t.ativo : '', entPx: null, entVol: null, entLock: false, saiPx: null, saiVol: null, saiLock: false, teoVol: null };
      if (tp !== 'STOCK' && t.spot && l.exp) {
        var bl = t.chain.expirations.filter(function (e) { return e.exp === l.exp; })[0];
        var best = null; ((bl && bl.rows) || []).forEach(function (r) { var o = tp === 'PUT' ? r.put : r.call; if (o && (!best || Math.abs(r.strike - t.spot) < Math.abs(best - t.spot))) best = r.strike; });
        if (best) l.strike = best;
      }
      t.legs.push(l); aplicaCotacao(t, l, true); marcaSujo(); renderLegs(); calcula();
    });
  });
  $('sf-montar').addEventListener('click', function () {
    t.legs.forEach(function (l) {
      if (l.type === 'STOCK') { if (t.spot) l.entPx = t.spot; }
      else { var p = precoMercado(l, l.q, false); if (p != null) l.entPx = p; l.entVol = null; }
      l.entLock = true; recalcVols(t, l);
    });
    marcaSujo(); renderLegs(); calcula();
    copiaPnt(t.legs.filter(function (l) { return l.on && l.type !== 'STOCK'; }).map(function (l) {
      return { ticker: l.ticker, side: l.side, qty: l.qty, px: l.entPx || 0 }; }), 'montagem');
  });
  $('sf-reverter').addEventListener('click', function () {
    // ordem de DESMONTAGEM (lados invertidos, preços de saída) vai para a área de transferência
    copiaPnt(t.legs.filter(function (l) { return l.on && l.type !== 'STOCK'; }).map(function (l) {
      return { ticker: l.ticker, side: l.side === 'BUY' ? 'SELL' : 'BUY', qty: l.qty, px: l.saiPx || 0 }; }), 'desmontagem');
    t.legs.forEach(function (l) { l.side = l.side === 'BUY' ? 'SELL' : 'BUY'; if (!l.saiLock) l.saiPx = null; aplicaCotacao(t, l, false); });
    marcaSujo(); renderLegs(); calcula();
  });
  // salvar
  $('sf-salvar').addEventListener('click', function () { salvar(t, false); });
  $('sf-savedd').addEventListener('click', function (e) { e.stopPropagation(); $('sf-menu').classList.toggle('on'); });
  $('sf-menu').addEventListener('click', function (e) {
    var m = e.target.closest('[data-m]'); if (!m) return; $('sf-menu').classList.remove('on');
    if (m.dataset.m === 'como') salvar(t, true);
    else if (m.dataset.m === 'copia') {
      var c = novaAba({ name: t.name + ' (cópia)', ativo: t.ativo });
      c.chain = t.chain; c.spot = t.spot; c.chg = t.chg; c.ewma = t.ewma; c.ivAtivo = t.ivAtivo; c.hora = t.hora; c.juros = t.juros;
      c.legs = JSON.parse(JSON.stringify(t.legs)); c.legs.forEach(function (l, k) { l.q = t.legs[k].q; });
      CUR = TABS.length - 1; render();
    } else if (m.dataset.m === 'tudo') salvarTudo();
    else if (m.dataset.m === 'nome') { var n = prompt('Nome da estratégia:', t.name); if (n && n.trim()) { t.name = n.trim(); marcaSujo(); renderTabs(); } }
  });
  // tabela de pernas
  var tb = $('sf-legs');
  tb.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var i = +b.closest('tr').dataset.i, l = t.legs[i];
    if (b.dataset.act === 'del') t.legs.splice(i, 1);
    else if (b.dataset.act === 'side') { l.side = l.side === 'BUY' ? 'SELL' : 'BUY'; if (!l.entLock) l.entPx = null; if (!l.saiLock) l.saiPx = null; aplicaCotacao(t, l, true); }
    else if (b.dataset.act === 'entLock') l.entLock = !l.entLock;
    else if (b.dataset.act === 'saiLock') { l.saiLock = !l.saiLock; if (!l.saiLock) aplicaCotacao(t, l, false); }
    else if (b.dataset.act === 'on') { l.on = b.checked; }
    marcaSujo(); renderLegs(); calcula();
  });
  tb.addEventListener('change', function (e) {
    var f = e.target.dataset.f; if (!f) return;
    var i = +e.target.closest('tr').dataset.i, l = t.legs[i], v = e.target.value;

function escolhePasso(p) { var e = Math.pow(10, Math.floor(Math.log10(p))), m = p / e; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * e; }

window.addEventListener('resize', function () { if (TAB()) desenha(); });

// ── render geral ─────────────────────────────────────────────────────────
function render() {

window.addEventListener('beforeunload', function (e) { if (TABS.some(function (t) { return t.dirty && t.legs.length; })) { e.preventDefault(); e.returnValue = ''; } });

// ── Histórico da operação (estrutura vinda da produção) ─────────────────
function brlS(v) { return (v >= 0 ? '+' : '−') + 'R$ ' + fmt(Math.abs(v)); }
function legTag(side) { return '<span class="sf-leg ' + (side === 'SELL' ? 'v' : 'c') + '">' + (side === 'SELL' ? 'V' : 'C') + '</span>'; }
function eventosDe(h, legs) {
  var ev = [];
  (h.extrato || []).forEach(function (m) {
    var fechada = m.tipo === 'Encerrada';
    ev.push({ data: m.data || '', titulo: (fechada ? '🗑️ Perna encerrada' : '🔄 Perna substituída'),
      corpo: legTag(m.side) + '<b>' + esc(m.ticker) + '</b> × ' + m.quantity + ': entrou a R$ ' + fmt(m.entrada) + ' e saiu a R$ ' + fmt(m.saida) +
             (m.novo ? '<br>➜ entrou no lugar ' + legTag(m.side) + '<b>' + esc(m.novo) + '</b>' + (m.novo_premio != null ? ' a R$ ' + fmt(m.novo_premio) : '') : ''),
      pnl: +m.pnl || 0, conta: m.contabiliza !== false });
  });
  (h.rolagens || []).forEach(function (r) {
    if (r.old_long_ticker != null) {        // rolagem de trava
      var q = +r.quantity || 1;
      var pnl = ((+r.old_short_price || 0) - (+r.old_long_price || 0) + (+r.close_long_price || 0) - (+r.close_short_price || 0)) * q;
      ev.push({ data: r.rolled_at || '', titulo: '🔁 Rolagem da trava' + (r.roll_type ? ' (' + esc(r.roll_type) + ')' : ''),
        corpo: 'Fechou ' + legTag('BUY') + '<b>' + esc(r.old_long_ticker) + '</b> ' + fmt(r.old_long_price) + ' → ' + fmt(r.close_long_price) +
               ' e ' + legTag('SELL') + '<b>' + esc(r.old_short_ticker) + '</b> ' + fmt(r.old_short_price) + ' → ' + fmt(r.close_short_price) +
               '<br>➜ abriu ' + legTag('BUY') + '<b>' + esc(r.new_long_ticker) + '</b> a ' + fmt(r.new_long_price) + ' e ' + legTag('SELL') + '<b>' + esc(r.new_short_ticker) + '</b> a ' + fmt(r.new_short_price) +
               (r.new_exp ? ' (venc. ' + brD(r.new_exp) + ')' : '') + (r.notes ? '<br><i>' + esc(r.notes) + '</i>' : ''),
        pnl: pnl, conta: true });
    } else if (r.old_ticker != null) {      // rolagem de opção individual
      var op = legs.filter(function (l) { return l.type !== 'STOCK'; })[0] || { side: 'SELL', qty: 100 };
      var pn = (op.side === 'SELL' ? (+r.old_premium || 0) - (+r.close_premium || 0) : (+r.close_premium || 0) - (+r.old_premium || 0)) * (op.qty || 0);
      ev.push({ data: r.rolled_at || '', titulo: '🔁 Rolagem da opção' + (r.roll_type ? ' (' + esc(r.roll_type) + ')' : ''),
        corpo: legTag(op.side) + '<b>' + esc(r.old_ticker) + '</b> (K ' + fmt(r.old_strike) + (r.old_exp ? ', ' + brD(r.old_exp) : '') + '): entrou a ' + fmt(r.old_premium) + ', zerada a ' + fmt(r.close_premium) +
               '<br>➜ nova ' + legTag(op.side) + '<b>' + esc(r.new_ticker) + '</b> (K ' + fmt(r.new_strike) + (r.new_exp ? ', ' + brD(r.new_exp) : '') + ') a ' + fmt(r.new_premium) +
               (r.notes ? '<br><i>' + esc(r.notes) + '</i>' : ''),
        pnl: pn, conta: true, opcao: true });

}
function sparkSaldo(ev) {
  if (ev.length < 1) return '';

    '<polyline fill="none" stroke="' + cor + '" stroke-width="2.2" points="' + pts + '"/>' +
    vals.map(function (v, i) { return '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="3.2" fill="' + cor + '"/>'; }).join('') + '</svg>';

function renderHist() {

  var h = t.hist, ev = eventosDe(h, t.legs);

  var aberto = 0; t.legs.forEach(function (l) { if (l.on && l.saiPx != null && l.entPx != null) aberto += sgn(l) * l.qty * (l.saiPx - l.entPx); });

    ev.forEach(function (e, i) {

        '<div class="bd">' + e.corpo + (e.conta ? '' : '<br><span style="color:var(--sf-mut);">(já lançado no Histórico de trades — fora do saldo carregado)</span>') +
        (e.opcao ? '<br><span style="color:var(--sf-mut);">(rolagem de opção individual: resultado calculado aqui; a tela de acompanhamento não o soma)</span>' : '') + '</div></div>';
    });

      '<div class="bd">' + t.legs.filter(function (l) { return l.on; }).map(function (l) { return legTag(l.side) + '<b>' + esc(l.type === 'STOCK' ? t.ativo : l.ticker) + '</b> × ' + l.qty + ' a R$ ' + fmt(l.entPx); }).join(' &nbsp; ') + '</div></div>';
    html += '</div>';

  html += '<div style="font-size:.78rem;color:var(--sf-mut);margin:.7rem 0 .3rem;">Como ler</div><ul style="font-size:.78rem;color:#cfcfcf;margin:0;padding-left:1.1rem;line-height:1.55;">' +
    '<li>As curvas mostram o resultado <b>da operação inteira</b> quando “somar o carregado” está ligado (deslocadas pelo saldo das rolagens).</li>' +

function importarDaProducao() {
  var d = null;

    return { on: true, type: tp === 'STOCK' ? 'STOCK' : tp, side: g.side, qty: +g.quantity || 0, exp: tp === 'STOCK' ? '' : (g.expiration_date || ''),
             strike: +g.strike || 0, ticker: g.ticker, entPx: +g.entry_price || 0, entVol: null, entLock: true,
